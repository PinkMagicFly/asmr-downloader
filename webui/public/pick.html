<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择要下载的文件</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6fa; color: #2c3e50; padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .search-bar {
    background: #fff; border-radius: 10px; padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px;
    display: flex; gap: 10px;
  }
  .search-bar input {
    flex: 1; border: 1px solid #dcdfe6; border-radius: 6px;
    padding: 9px 14px; font-size: 14px; outline: none;
  }
  .search-bar input:focus { border-color: #409eff; }
  .search-bar button {
    border: none; background: #409eff; color: #fff; border-radius: 6px;
    padding: 9px 24px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .search-bar button:hover { background: #66b1ff; }
  .search-bar button:disabled { background: #a0cfff; cursor: not-allowed; }
  .header {
    display: none; background: #fff; border-radius: 10px; padding: 20px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px;
  }
  .header h1 { font-size: 18px; margin-bottom: 6px; word-break: break-all; }
  .header .folder { font-size: 13px; color: #7f8c8d; word-break: break-all; }
  .toolbar {
    display: none; background: #fff; border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px;
    flex-wrap: wrap; gap: 8px; align-items: center;
    position: sticky; top: 10px; z-index: 10;
  }
  .toolbar button {
    border: 1px solid #dcdfe6; background: #fff; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; color: #606266;
  }
  .toolbar button:hover { border-color: #409eff; color: #409eff; }
  .toolbar .counter { margin-left: auto; font-size: 13px; color: #909399; }
  .ext-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ext-group .ext-label { font-size: 12px; color: #909399; }
  .ext-group button.audio { border-color: #b3e19d; color: #67c23a; }
  .ext-group button.video { border-color: #f5dab1; color: #e6a23c; }
  .toolbar .submit {
    background: #409eff; border-color: #409eff; color: #fff;
    padding: 8px 22px; font-size: 14px;
  }
  .toolbar .submit:hover { background: #66b1ff; }
  .toolbar .submit:disabled { background: #a0cfff; cursor: not-allowed; }
  .toolbar .submit-secondary {
    background: #fff; border-color: #409eff; color: #409eff;
    padding: 8px 22px; font-size: 14px;
  }
  .toolbar .submit-secondary:hover { background: #ecf5ff; }
  .toolbar .submit-secondary:disabled { border-color: #a0cfff; color: #a0cfff; cursor: not-allowed; }
  .tree {
    display: none; background: #fff; border-radius: 10px; padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .tree ul { list-style: none; padding-left: 24px; }
  .tree > ul { padding-left: 0; }
  .node { padding: 3px 0; }
  .node label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 14px; line-height: 1.7; border-radius: 4px; padding: 2px 6px;
  }
  .node label:hover { background: #f0f7ff; }
  .node input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #409eff; }
  .icon { flex-shrink: 0; }
  .fname { word-break: break-all; }
  .ext {
    flex-shrink: 0; font-size: 11px; color: #909399; background: #f4f4f5;
    border-radius: 4px; padding: 1px 6px; text-transform: uppercase;
  }
  .ext.audio { color: #67c23a; background: #f0f9eb; }
  .ext.video { color: #e6a23c; background: #fdf6ec; }
  .size { flex-shrink: 0; font-size: 12px; color: #b0b6bf; min-width: 70px; text-align: right; }
  .result {
    display: none; background: #f0f9eb; border: 1px solid #c2e7b0;
    border-radius: 10px; padding: 20px 24px; margin-bottom: 16px;
    color: #529b2e; font-size: 14px; line-height: 1.9; word-break: break-all;
  }
  .result.error { background: #fef0f0; border-color: #fbc4c4; color: #c45656; }
  .placeholder { text-align: center; color: #909399; padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="search-bar">
    <input id="rjInput" type="text" placeholder="输入 RJ 号，例如 RJ01526160" autofocus>
    <button id="searchBtn" onclick="searchWork()">搜索</button>
  </div>
  <div class="result" id="result"></div>
  <div class="header" id="header">
    <h1 id="workTitle"></h1>
    <div class="folder" id="folderName"></div>
  </div>
  <div class="toolbar" id="toolbar">
    <button onclick="setAll(true)">全选</button>
    <button onclick="setAll(false)">全不选</button>
    <button onclick="invertAll()">反选</button>
    <span class="ext-group" id="extGroup"></span>
    <span class="counter" id="counter"></span>
    <button class="submit-secondary" id="exportOnlyBtn" onclick="submitSelection(false)">仅导出</button>
    <button class="submit" id="submitBtn" onclick="submitSelection(true)">导出并添加到 IDM</button>
  </div>
  <div class="tree" id="tree"></div>
  <div class="placeholder" id="placeholder">输入 RJ 号搜索作品，勾选要下载的文件后交给 IDM 下载</div>
</div>

<script>
const AUDIO_EXT = ['.mp3', '.wav', '.flac', '.m4a', '.ogg', '.aac'];
const VIDEO_EXT = ['.mp4', '.webm', '.mkv', '.avi', '.mov'];
let fileNodes = []; // {cb, url, ext}
let currentId = '';

function getExt(name) {
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(i).toLowerCase() : '';
}

function formatSize(bytes) {
  if (!bytes || bytes <= 0) return '';
  if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return bytes + ' B';
}

function buildNode(track) {
  const li = document.createElement('li');
  li.className = 'node';
  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true; // 默认全选
  const icon = document.createElement('span');
  icon.className = 'icon';
  const name = document.createElement('span');
  name.className = 'fname';
  name.textContent = track.title;
  label.appendChild(cb);
  label.appendChild(icon);
  label.appendChild(name);

  if (track.type === 'folder') {
    icon.textContent = '📁';
    li.appendChild(label);
    const ul = document.createElement('ul');
    const childCbs = [];
    (track.children || []).forEach(child => {
      const node = buildNode(child);
      ul.appendChild(node.el);
      childCbs.push(...node.fileCbs);
    });
    li.appendChild(ul);
    // 父级勾选级联到所有子孙文件
    cb.addEventListener('change', () => {
      childCbs.forEach(c => { c.checked = cb.checked; });
      updateAncestors(li);
      updateCounter();
    });
    childCbs.forEach(c => c.addEventListener('change', () => {
      updateAncestors(li);
    }));
    return { el: li, fileCbs: childCbs };
  } else {
    icon.textContent = '📄';
    const ext = getExt(track.title);
    if (ext) {
      const badge = document.createElement('span');
      badge.className = 'ext' + (AUDIO_EXT.includes(ext) ? ' audio' : VIDEO_EXT.includes(ext) ? ' video' : '');
      badge.textContent = ext.slice(1);
      label.appendChild(badge);
    }
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = formatSize(track.size);
    label.appendChild(size);
    li.appendChild(label);
    fileNodes.push({ cb, url: track.mediaDownloadUrl, ext });
    cb.addEventListener('change', updateCounter);
    return { el: li, fileCbs: [cb] };
  }
}

// 根据子节点状态更新所有祖先文件夹勾选框（含半选态）
function updateAncestors(li) {
  let cur = li.parentElement && li.parentElement.parentElement;
  while (cur && cur.classList && cur.classList.contains('node')) {
    const folderCb = cur.querySelector(':scope > label > input[type="checkbox"]');
    const boxes = cur.querySelectorAll('ul input[type="checkbox"]');
    let checked = 0;
    boxes.forEach(b => { if (b.checked) checked++; });
    folderCb.checked = checked === boxes.length && boxes.length > 0;
    folderCb.indeterminate = checked > 0 && checked < boxes.length;
    cur = cur.parentElement && cur.parentElement.parentElement;
  }
}

function updateCounter() {
  const total = fileNodes.length;
  const sel = fileNodes.filter(f => f.cb.checked).length;
  document.getElementById('counter').textContent = `已选 ${sel} / ${total} 个文件`;
}

function setAll(v) {
  document.querySelectorAll('#tree input[type="checkbox"]').forEach(cb => {
    cb.checked = v; cb.indeterminate = false;
  });
  updateCounter();
}

function invertAll() {
  fileNodes.forEach(f => { f.cb.checked = !f.cb.checked; });
  document.querySelectorAll('#tree li.node').forEach(updateAncestors);
  updateCounter();
}

function selectExtOnly(ext) {
  fileNodes.forEach(f => { f.cb.checked = f.ext === ext; });
  document.querySelectorAll('#tree li.node').forEach(updateAncestors);
  updateCounter();
}

// 根据文件树中实际出现的后缀，动态生成快捷筛选按钮
function renderExtButtons() {
  const group = document.getElementById('extGroup');
  group.innerHTML = '';
  const counts = {};
  fileNodes.forEach(f => {
    const key = f.ext || '(无后缀)';
    counts[key] = (counts[key] || 0) + 1;
  });
  const exts = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (exts.length === 0) return;
  const label = document.createElement('span');
  label.className = 'ext-label';
  label.textContent = '按类型:';
  group.appendChild(label);
  exts.forEach(ext => {
    const btn = document.createElement('button');
    if (AUDIO_EXT.includes(ext)) btn.className = 'audio';
    else if (VIDEO_EXT.includes(ext)) btn.className = 'video';
    const display = ext === '(无后缀)' ? ext : ext.slice(1).toUpperCase();
    btn.textContent = `${display} (${counts[ext]})`;
    btn.title = `只选中 ${display} 文件`;
    btn.onclick = () => selectExtOnly(ext);
    group.appendChild(btn);
  });
}

function showResult(ok, html) {
  const result = document.getElementById('result');
  result.className = 'result' + (ok ? '' : ' error');
  result.innerHTML = html;
  result.style.display = 'block';
}

async function searchWork() {
  const input = document.getElementById('rjInput');
  const btn = document.getElementById('searchBtn');
  const id = input.value.trim();
  if (!id) return;
  btn.disabled = true;
  btn.textContent = '搜索中...';
  document.getElementById('result').style.display = 'none';
  try {
    const resp = await fetch('/api/work?id=' + encodeURIComponent(id));
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '获取失败');

    currentId = data.id;
    fileNodes = [];
    document.getElementById('workTitle').textContent = data.title;
    document.getElementById('folderName').textContent = '保存到: ' + data.folderName;
    const tree = document.getElementById('tree');
    tree.innerHTML = '';
    const ul = document.createElement('ul');
    (data.tree || []).forEach(t => ul.appendChild(buildNode(t).el));
    tree.appendChild(ul);

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('header').style.display = 'block';
    document.getElementById('toolbar').style.display = 'flex';
    tree.style.display = 'block';
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = false;
    submitBtn.textContent = '导出并添加到 IDM';
    const exportOnlyBtn = document.getElementById('exportOnlyBtn');
    exportOnlyBtn.disabled = false;
    exportOnlyBtn.textContent = '仅导出';
    renderExtButtons();
    updateCounter();
  } catch (e) {
    showResult(false, '❌ ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '搜索';
  }
}

async function submitSelection(runIdm) {
  const selected = fileNodes.filter(f => f.cb.checked).map(f => f.url);
  if (selected.length === 0) {
    alert('请至少勾选一个文件');
    return;
  }
  const btn = runIdm ? document.getElementById('submitBtn') : document.getElementById('exportOnlyBtn');
  const btnText = btn.textContent;
  btn.disabled = true;
  btn.textContent = runIdm ? '正在导出并添加到 IDM...' : '正在导出...';
  try {
    const resp = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentId, selected, run_idm: runIdm })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '导出失败');
    let msg = `✅ ${currentId} 导出完成，共 <b>${data.count}</b> 个链接<br>作品目录：${data.dir}<br>`;
    if (runIdm) {
      if (data.idm_error) {
        showResult(false, `⚠️ 导出成功，但添加到 IDM 失败：${data.idm_error}<br>作品目录：${data.dir}（可手动双击 download_scripts\\idm_download.bat）`);
        btn.disabled = false;
        btn.textContent = btnText;
        return;
      }
      msg += `已按"大文件优先"顺序将 <b>${data.idm_added}</b> 个任务添加到 IDM 队列，请打开 IDM 查看<br>`;
    } else {
      msg += `双击 <b>download_scripts\\idm_download.bat</b> 可将任务添加到 IDM<br>`;
    }
    msg += `下载完成后双击 <b>cleanup_links.bat</b> 一键清理 links.txt 和下载脚本<br>可以继续搜索下一个作品`;
    showResult(true, msg);
    btn.disabled = false;
    btn.textContent = btnText;
  } catch (e) {
    showResult(false, '❌ ' + e.message);
    btn.disabled = false;
    btn.textContent = btnText;
  }
}

document.getElementById('rjInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchWork();
});

// 支持 ?id=RJ... 直接加载
(function init() {
  const id = new URLSearchParams(location.search).get('id');
  if (id) {
    document.getElementById('rjInput').value = id;
    searchWork();
  }
})();
</script>
</body>
</html>
